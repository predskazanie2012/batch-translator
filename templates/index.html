<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Translator</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/icon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png">
<style>
:root {
  --bg:       #F8FAFC;
  --white:    #FFFFFF;
  --accent:   #6366F1;
  --accent-h: #4F46E5;
  --accent-l: #EEF2FF;
  --accent-m: #C7D2FE;
  --text:     #0F172A;
  --muted:    #64748B;
  --dim:      #94A3B8;
  --border:   #E2E8F0;
  --card-sh:  0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  --r:        14px;
  --r-sm:     8px;
  --success:  #059669;
  --danger:   #DC2626;
  --warn:     #D97706;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--dim); }

/* ── Header ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  height: 60px;
  display: flex; align-items: center;
  padding: 0 28px; gap: 14px;
}
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #6366F1, #818CF8);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 17px;
  box-shadow: 0 4px 12px rgba(99,102,241,.35);
  flex-shrink: 0;
}
.brand { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.brand-tag {
  font-size: 11px; font-weight: 500;
  background: var(--accent-l); color: var(--accent);
  padding: 2px 8px; border-radius: 20px; margin-left: 8px;
}
.header-stats { margin-left: auto; display: flex; gap: 8px; }
.stat-chip {
  display: flex; align-items: center; gap: 7px;
  background: var(--bg); border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
  color: var(--muted); transition: all .2s;
}
.stat-chip.has-val { border-color: var(--accent-m); background: var(--accent-l); color: var(--accent); }
.stat-chip-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border); flex-shrink: 0;
}
.stat-chip.has-val .stat-chip-dot { background: var(--accent); }

/* ── Main grid ── */
main {
  max-width: 1440px; margin: 0 auto;
  padding: 24px 28px;
  display: grid;
  grid-template-columns: 256px 1fr 288px;
  grid-template-rows: 1fr auto;
  gap: 18px;
  min-height: calc(100vh - 60px);
}

/* ── Card ── */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--card-sh);
}
.card-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.card-head-icon {
  width: 30px; height: 30px; border-radius: var(--r-sm);
  background: var(--accent-l); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.card-title { font-size: 13px; font-weight: 700; letter-spacing: .1px; }

/* ── Section label ── */
.slabel {
  font-size: 10px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
}
.form-group { margin-bottom: 20px; }

/* ── Radio buttons ── */
.radio-stack { display: flex; flex-direction: column; gap: 4px; }
.radio-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--r-sm);
  cursor: pointer; transition: background .15s; user-select: none;
  border: 1.5px solid transparent;
}
.radio-item:hover { background: var(--bg); }
.radio-item.active { background: var(--accent-l); border-color: var(--accent-m); }
.radio-circle {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s;
}
.radio-item.active .radio-circle { border-color: var(--accent); }
.radio-circle::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); opacity: 0; transition: opacity .15s;
}
.radio-item.active .radio-circle::after { opacity: 1; }
.radio-label { font-size: 13px; }

/* ── Input ── */
.inp {
  width: 100%; padding: 8px 10px;
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-size: 12px; font-family: inherit; color: var(--text);
  background: var(--white); outline: none; transition: border-color .15s, box-shadow .15s;
}
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
.inp:disabled { background: var(--bg); color: var(--dim); cursor: not-allowed; }
select.inp { cursor: pointer; }
.inp-row { display: flex; gap: 6px; }
.inp-row .inp { flex: 1; }

/* ── Divider ── */
.sep { height: 1px; background: var(--border); margin: 18px 0; }

/* ── Files ── */
.dropzone {
  border: 2px dashed var(--border); border-radius: var(--r);
  padding: 36px 20px; text-align: center;
  cursor: pointer; transition: all .2s; background: var(--bg);
  margin-bottom: 14px; position: relative; overflow: hidden;
}
.dropzone::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(99,102,241,.04), rgba(129,140,248,.06));
  opacity: 0; transition: opacity .2s;
}
.dropzone:hover, .dropzone.over {
  border-color: var(--accent); background: var(--accent-l);
}
.dropzone:hover::before, .dropzone.over::before { opacity: 1; }
.dropzone-emoji { font-size: 36px; margin-bottom: 10px; }
.dropzone-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
.dropzone-sub { font-size: 12px; color: var(--muted); }
.dropzone-sub b { color: var(--accent); font-weight: 600; cursor: pointer; }

.file-list { display: flex; flex-direction: column; gap: 6px; }
.file-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--bg);
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:translateY(0); } }
.file-icon { font-size: 18px; flex-shrink: 0; }
.file-meta { flex: 1; min-width: 0; }
.file-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-size { font-size: 11px; color: var(--dim); }
.file-rm {
  width: 24px; height: 24px; border-radius: 6px;
  border: none; background: none; cursor: pointer;
  color: var(--dim); font-size: 17px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0;
}
.file-rm:hover { background: #FEE2E2; color: var(--danger); }
.files-footer {
  display: flex; align-items: center; margin-top: 12px;
  padding-top: 12px; border-top: 1px solid var(--border);
  gap: 8px;
}
.files-footer-count { font-size: 11px; color: var(--dim); margin-left: auto; }

/* ── Languages ── */
.lang-toolbar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.lang-search-wrap {
  position: relative; margin-bottom: 8px;
}
.lang-search {
  width: 100%; padding: 7px 32px 7px 30px;
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-size: 12px; font-family: inherit; color: var(--text);
  background: var(--bg); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.lang-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99,102,241,.1);
  background: var(--white);
}
.lang-search-icon {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  color: var(--dim); font-size: 13px; pointer-events: none; line-height: 1;
}
.lang-search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--dim); color: #fff; border: none; cursor: pointer;
  font-size: 11px; line-height: 1; display: none;
  align-items: center; justify-content: center;
  transition: background .15s;
}
.lang-search-clear:hover { background: var(--muted); }
.lang-search-clear.visible { display: flex; }
.lang-no-results {
  text-align: center; padding: 20px; color: var(--dim);
  font-size: 12px; display: none;
}
.lang-item.hidden { display: none; }
.lang-badge {
  margin-left: auto; min-width: 26px; height: 26px; border-radius: 13px;
  background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 700; padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s;
}
.lang-badge.bounce { animation: bounce .3s ease; }
@keyframes bounce { 0%,100% { transform:scale(1); } 50% { transform:scale(1.25); } }

.lang-scroll {
  height: 430px; overflow-y: auto;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 6px;
}
.lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.lang-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 6px;
  cursor: pointer; user-select: none; transition: background .12s;
}
.lang-item:hover { background: var(--bg); }
.lang-item.on { background: var(--accent-l); }
.lang-cb {
  width: 15px; height: 15px; border-radius: 4px;
  border: 1.5px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: #fff; transition: all .12s;
}
.lang-item.on .lang-cb { background: var(--accent); border-color: var(--accent); }
.lang-cb svg { display: none; }
.lang-item.on .lang-cb svg { display: block; }
.lang-name { font-size: 11.5px; color: var(--dim); font-weight: 500; line-height: 1.2; }
.lang-item.on .lang-name { color: var(--accent); }

/* ── Bottom ── */
.bottom { grid-column: 1 / -1; }

/* Progress card inner */
.prog-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
}
.prog-status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--dim); flex-shrink: 0; transition: background .3s;
}
.prog-status-dot.running { background: var(--accent); animation: pulse 1.4s infinite; }
.prog-status-dot.done    { background: var(--success); }
.prog-status-dot.err     { background: var(--danger); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.prog-label { font-size: 14px; font-weight: 600; }
.prog-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.prog-pct { margin-left: auto; font-size: 26px; font-weight: 800; color: var(--accent); min-width: 54px; text-align: right; }

.pbar-track {
  height: 8px; background: var(--bg);
  border-radius: 10px; overflow: hidden; margin-bottom: 18px;
}
.pbar-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366F1, #A78BFA);
  border-radius: 10px; width: 0%;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 20px; border: none; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .18s; font-family: inherit; white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, #6366F1, #818CF8);
  color: #fff; box-shadow: 0 3px 12px rgba(99,102,241,.3);
}
.btn-primary:hover { background: linear-gradient(135deg, #4F46E5, #6366F1); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99,102,241,.35); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { background: var(--dim); box-shadow: none; cursor: not-allowed; transform: none; }
.btn-ghost { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--white); color: var(--text); border-color: var(--dim); }
.btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
.btn-danger { background: #FEE2E2; color: var(--danger); border: 1px solid #FECACA; }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-danger:disabled { opacity: .4; cursor: not-allowed; }
.btn-success { background: #D1FAE5; color: var(--success); border: 1px solid #A7F3D0; }
.btn-success:hover { background: var(--success); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
.btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.eta-txt { font-size: 12px; color: var(--muted); margin-left: 6px; }

/* ── Log ── */
.log-wrap {
  margin-top: 18px;
  background: #0F172A; border-radius: 10px;
  padding: 0;
  overflow: hidden;
}
.log-header {
  display: flex; align-items: center;
  padding: 8px 14px; background: #1E293B;
  border-bottom: 1px solid rgba(255,255,255,.05);
}
.log-title { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #475569; }
.log-clear { margin-left: auto; font-size: 11px; color: #475569; background: none; border: none; cursor: pointer; font-family: inherit; }
.log-clear:hover { color: #94A3B8; }
.log-body {
  height: 170px; overflow-y: auto;
  padding: 12px 14px; font-size: 12px;
  font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
  line-height: 1.65; scroll-behavior: smooth;
}
.log-body::-webkit-scrollbar-thumb { background: #334155; }
.ll { }
.ll-ok   { color: #34D399; }
.ll-err  { color: #F87171; }
.ll-info { color: #60A5FA; }
.ll-warn { color: #FBBF24; }
.ll-dim  { color: #475569; }
.ll-ts   { color: #334155; margin-right: 8px; font-size: 10px; }

/* ── Toasts ── */
#toasts { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 13px; min-width: 280px; max-width: 360px;
  animation: toastIn .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events: auto;
}
@keyframes toastIn { from { opacity:0; transform:translateX(20px) scale(.9); } to { opacity:1; transform:translateX(0) scale(1); } }
.toast-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
.toast-msg { flex: 1; line-height: 1.4; }
.toast.success { border-left: 3px solid var(--success); }
.toast.error   { border-left: 3px solid var(--danger); }
.toast.info    { border-left: 3px solid var(--accent); }

/* ── Responsive ── */
@media (max-width: 1100px) {
  main { grid-template-columns: 240px 1fr; }
  .langs-col { grid-column: 1 / -1; }
  .lang-grid { grid-template-columns: repeat(4, 1fr); }
  .lang-scroll { height: 220px; }
}
@media (max-width: 700px) {
  main { grid-template-columns: 1fr; padding: 12px; }
  .bottom { grid-column: 1; }
}
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">T</div>
  <span class="brand">Batch Translator</span>
  <span class="brand-tag">52 языка</span>
  <div class="header-stats">
    <div class="stat-chip" id="sc-files"><div class="stat-chip-dot"></div><span id="sv-files">0 файлов</span></div>
    <div class="stat-chip" id="sc-langs"><div class="stat-chip-dot"></div><span id="sv-langs">0 языков</span></div>
    <div class="stat-chip" id="sc-total"><div class="stat-chip-dot"></div><span id="sv-total">0 переводов</span></div>
  </div>
</header>

<!-- ── Main ── -->
<main>

  <!-- Settings -->
  <div class="card" style="align-self:start; position:sticky; top:78px;">
    <div class="card-head">
      <div class="card-head-icon">⚙️</div>
      <div class="card-title">Настройки</div>
    </div>

    <div class="form-group">
      <div class="slabel">Язык оригинала</div>
      <select class="inp" id="src-lang">
        <option value="auto">Определить автоматически</option>
      </select>
    </div>

    <div class="sep"></div>

    <div class="form-group">
      <div class="slabel">Движок перевода</div>
      <div class="radio-stack" id="engine-group">
        <label class="radio-item active" data-val="google_cloud">
          <div class="radio-circle"></div>
          <span class="radio-label">Google Cloud API</span>
        </label>
        <label class="radio-item" data-val="deepl">
          <div class="radio-circle"></div>
          <span class="radio-label">DeepL API</span>
        </label>
      </div>
    </div>

    <div id="creds-box" class="form-group" style="display:none">
      <div class="slabel" id="creds-label">Credentials</div>
      <input class="inp" id="creds-inp" type="text" placeholder="Введите значение...">
    </div>

    <div class="sep"></div>

    <div class="form-group" style="margin-bottom:0">
      <div class="slabel">Формат вывода</div>
      <div class="radio-stack" id="fmt-group">
        <label class="radio-item active" data-val="docx">
          <div class="radio-circle"></div>
          <span class="radio-label">Word (.docx)</span>
        </label>
        <label class="radio-item" data-val="txt">
          <div class="radio-circle"></div>
          <span class="radio-label">Текстовый (.txt)</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Files -->
  <div class="card">
    <div class="card-head">
      <div class="card-head-icon">📂</div>
      <div class="card-title">Файлы для перевода</div>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="dropzone-emoji">📄</div>
      <div class="dropzone-title">Перетащите файлы сюда</div>
      <div class="dropzone-sub">или <b onclick="document.getElementById('file-inp').click()">нажмите для выбора</b> &nbsp;·&nbsp; .docx и .txt</div>
    </div>
    <input type="file" id="file-inp" multiple accept=".docx,.txt" style="display:none">

    <div class="file-list" id="file-list"></div>

    <div class="files-footer" id="files-footer" style="display:none">
      <button class="btn btn-ghost btn-sm" onclick="clearFiles()">Очистить всё</button>
      <span class="files-footer-count" id="file-count">0 файлов</span>
    </div>
  </div>

  <!-- Languages -->
  <div class="card langs-col">
    <div class="card-head">
      <div class="card-head-icon">🌐</div>
      <div class="card-title">Языки перевода</div>
    </div>
    <div class="lang-toolbar">
      <button class="btn btn-ghost btn-sm" onclick="selAll()">Выбрать все</button>
      <button class="btn btn-ghost btn-sm" onclick="selNone()">Снять все</button>
      <div class="lang-badge" id="lang-badge">0</div>
    </div>
    <div class="lang-search-wrap">
      <span class="lang-search-icon">🔍</span>
      <input class="lang-search" id="lang-search" type="text"
             placeholder="Поиск языка..." autocomplete="off" oninput="filterLangs(this.value)">
      <button class="lang-search-clear" id="lang-search-clear"
              onclick="clearLangSearch()" title="Очистить">×</button>
    </div>
    <div class="lang-scroll">
      <div class="lang-grid" id="lang-grid"></div>
      <div class="lang-no-results" id="lang-no-results">Ничего не найдено</div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="card bottom">
    <div class="prog-head">
      <div class="prog-status-dot" id="prog-dot"></div>
      <div>
        <div class="prog-label" id="prog-label">Готов к работе</div>
        <div class="prog-sub" id="prog-sub"></div>
      </div>
      <div class="prog-pct" id="prog-pct"></div>
    </div>

    <div class="pbar-track"><div class="pbar-fill" id="pbar"></div></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-start" onclick="startJob()">▶ Начать перевод</button>
      <button class="btn btn-danger"  id="btn-stop"  onclick="stopJob()"  disabled>■ Остановить</button>
      <button class="btn btn-success" id="btn-dl"    onclick="download()" style="display:none">⬇ Скачать ZIP</button>
      <span class="eta-txt" id="eta-txt"></span>
    </div>

    <div class="log-wrap">
      <div class="log-header">
        <span class="log-title">Лог</span>
        <button class="log-clear" onclick="clearLog()">Очистить</button>
      </div>
      <div class="log-body" id="log"></div>
    </div>
  </div>

</main>

<div id="toasts"></div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────
const LANGS = [
  ["Африкаанс","af"],["Амхарский","am-ET"],["Английский","en"],["Арабский","ar"],
  ["Армянский","hy-AM"],["Бенгальский","bn"],["Болгарский","bg"],["Венгерский","hu"],
  ["Вьетнамский","vi"],["Греческий","el"],["Грузинский","ka-GE"],["Гуджарати","gu"],
  ["Датский","da"],["Иврит","he"],["Индонезийский","id"],["Испанский","es"],
  ["Итальянский","it"],["Йоруба","yo-NG"],["Казахский","kk-KZ"],["Кантонский","yue"],
  ["Китайский (мандарин)","zh"],["Корейский","ko"],["Литовский","lt"],["Малайский","ms"],
  ["Маратхи","mr"],["Немецкий","de"],["Нидерландский","nl"],["Норвежский","no"],
  ["Пенджаби","pa"],["Персидский","fa-IR"],["Польский","pl"],["Португальский","pt"],
  ["Румынский","ro"],["Русский","ru"],["Сербский","sr"],["Словацкий","sk"],
  ["Словенский","sl"],["Суахили","sw-KE"],["Тайский","th"],["Тамильский","ta"],
  ["Телугу","te"],["Турецкий","tr"],["Узбекский","uz-UZ"],["Украинский","uk"],
  ["Филиппинский","fil"],["Финский","fi"],["Французский","fr"],["Хинди","hi"],
  ["Хорватский","hr"],["Чешский","cs"],["Шведский","sv"],["Японский","ja"],
];

const GC_CREDS  = "{{ gc_creds }}";
const DEEPL_HINT= "{{ deepl_key_hint }}";

let files      = [];    // {name, size, file}
let selLangs   = new Set();
let evtSource  = null;
let isRunning  = false;
let sseWarnAt  = 0;    // throttle "connection lost" warnings

// ── Init ─────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildLangGrid();
  buildSrcSelect();
  setupDropzone();
  setupRadios('engine-group', onEngineChange);
  setupRadios('fmt-group');
});

// ── Language grid ─────────────────────────────────────────────────────────
function buildLangGrid() {
  const g = document.getElementById('lang-grid');
  LANGS.forEach(([name, code]) => {
    const el = document.createElement('div');
    el.className = 'lang-item';
    el.dataset.code = code;
    el.innerHTML = `
      <div class="lang-cb">
        <svg width="9" height="7" viewBox="0 0 9 7" fill="none">
          <path d="M1 3.5L3.5 6L8 1" stroke="white" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="lang-name">${name}</span>`;
    el.addEventListener('click', () => toggleLang(code, el));
    g.appendChild(el);
  });
}

function toggleLang(code, el) {
  if (selLangs.has(code)) { selLangs.delete(code); el.classList.remove('on'); }
  else                     { selLangs.add(code);    el.classList.add('on');   }
  refreshBadge();
  updateStats();
}

function selAll() {
  // Only select visible (not hidden by search) items
  document.querySelectorAll('.lang-item:not(.hidden)').forEach(el => {
    el.classList.add('on'); selLangs.add(el.dataset.code);
  });
  refreshBadge(); updateStats();
}
function selNone() {
  document.querySelectorAll('.lang-item:not(.hidden)').forEach(el => {
    el.classList.remove('on'); selLangs.delete(el.dataset.code);
  });
  refreshBadge(); updateStats();
}

function filterLangs(q) {
  const clearBtn  = document.getElementById('lang-search-clear');
  const noResults = document.getElementById('lang-no-results');
  const needle    = q.trim().toLowerCase();
  let visible = 0;

  clearBtn.classList.toggle('visible', needle.length > 0);

  document.querySelectorAll('.lang-item').forEach(el => {
    const name = el.querySelector('.lang-name').textContent.toLowerCase();
    const code = el.dataset.code.toLowerCase();
    const match = !needle || name.startsWith(needle) || code.startsWith(needle)
                  || name.includes(needle);
    el.classList.toggle('hidden', !match);
    if (match) visible++;
  });

  noResults.style.display = visible === 0 ? 'block' : 'none';
}

function clearLangSearch() {
  const inp = document.getElementById('lang-search');
  inp.value = '';
  filterLangs('');
  inp.focus();
}
function refreshBadge() {
  const b = document.getElementById('lang-badge');
  b.textContent = selLangs.size;
  b.classList.add('bounce');
  setTimeout(() => b.classList.remove('bounce'), 350);
}

// ── Source language select ────────────────────────────────────────────────
function buildSrcSelect() {
  const sel = document.getElementById('src-lang');
  LANGS.forEach(([name, code]) => {
    const o = document.createElement('option');
    o.value = code; o.textContent = name;
    sel.appendChild(o);
  });
}

// ── Dropzone ─────────────────────────────────────────────────────────────
function setupDropzone() {
  const dz  = document.getElementById('dropzone');
  const inp = document.getElementById('file-inp');
  dz.addEventListener('click', () => inp.click());
  inp.addEventListener('change', e => addFiles(e.target.files));
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('over');
    addFiles(e.dataTransfer.files);
  });
}

function addFiles(list) {
  let added = 0;
  for (const f of list) {
    const ext = f.name.split('.').pop().toLowerCase();
    if (!['docx','txt'].includes(ext)) {
      toast(`"${f.name}" — только .docx и .txt`, 'error'); continue;
    }
    if (files.find(x => x.name === f.name)) continue;
    files.push({ name: f.name, size: f.size, file: f });
    added++;
  }
  renderFiles(); updateStats();
  if (added) log(`+ Добавлено файлов: ${added}`, 'info');
}

function renderFiles() {
  const list = document.getElementById('file-list');
  const foot = document.getElementById('files-footer');
  list.innerHTML = '';
  files.forEach((f, i) => {
    const ext  = f.name.split('.').pop();
    const icon = ext === 'docx' ? '📝' : '📄';
    const sz   = f.size > 1048576 ? `${(f.size/1048576).toFixed(1)} МБ` : `${Math.round(f.size/1024)} КБ`;
    const row  = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      <span class="file-icon">${icon}</span>
      <div class="file-meta">
        <div class="file-name">${f.name}</div>
        <div class="file-size">${sz}</div>
      </div>
      <button class="file-rm" onclick="removeFile(${i})" title="Удалить">×</button>`;
    list.appendChild(row);
  });
  foot.style.display = files.length ? 'flex' : 'none';
  document.getElementById('file-count').textContent = `${files.length} файл(ов)`;
}

function removeFile(i) { files.splice(i, 1); renderFiles(); updateStats(); }
function clearFiles()   { files = []; renderFiles(); updateStats(); }

// ── Stats ─────────────────────────────────────────────────────────────────
function updateStats() {
  const nf = files.length, nl = selLangs.size;
  set('sv-files', `${nf} файл${nf===1?'':'ов'}`);
  set('sv-langs', `${nl} язык${nl===1?'':'ов'}`);
  set('sv-total', `${nf*nl} переводов`);
  ['sc-files','sc-langs','sc-total'].forEach(id => {
    const v = id === 'sc-files' ? nf : id === 'sc-langs' ? nl : nf*nl;
    document.getElementById(id).classList.toggle('has-val', v > 0);
  });
}

// ── Radios ────────────────────────────────────────────────────────────────
function setupRadios(groupId, cb) {
  document.querySelectorAll(`#${groupId} .radio-item`).forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll(`#${groupId} .radio-item`).forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      if (cb) cb(item.dataset.val);
    });
  });
}
function getRadio(groupId) {
  return document.querySelector(`#${groupId} .radio-item.active`)?.dataset.val;
}

function onEngineChange(val) {
  const box   = document.getElementById('creds-box');
  const label = document.getElementById('creds-label');
  const inp   = document.getElementById('creds-inp');
  if (val === 'google_cloud') {
    box.style.display = 'block';
    label.textContent = 'Путь к credentials.json';
    inp.value = GC_CREDS;
    inp.type  = 'text';
  } else if (val === 'deepl') {
    box.style.display = 'block';
    label.textContent = 'DeepL API Key';
    inp.value = '';
    inp.placeholder = DEEPL_HINT ? DEEPL_HINT + ' (из .env)' : 'Введите API Key...';
    inp.type  = 'password';
  } else {
    box.style.display = 'none';
  }
}

// ── Translation ───────────────────────────────────────────────────────────
async function startJob() {
  if (!files.length)      { toast('Добавьте файлы для перевода', 'error'); return; }
  if (!selLangs.size)     { toast('Выберите хотя бы один язык', 'error'); return; }

  const engine  = getRadio('engine-group');
  const fmt     = getRadio('fmt-group');
  const src     = document.getElementById('src-lang').value;
  const creds   = document.getElementById('creds-inp').value.trim();
  const total   = files.length * selLangs.size;

  // Upload
  log('⟳  Загрузка файлов на сервер...', 'info');
  const fd = new FormData();
  files.forEach(f => fd.append('files', f.file));
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Upload error');
    log(`✓  Загружено: ${d.count} файл(ов)`, 'ok');
  } catch (e) { toast('Ошибка загрузки: ' + e.message, 'error'); return; }

  // Start translate
  try {
    const r = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        engine, fmt,
        src:      src === 'auto' ? null : src,
        langs:    [...selLangs],
        gc_creds: engine === 'google_cloud' ? creds : null,
        deepl_key:engine === 'deepl'        ? creds : null,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Start error');
  } catch (e) { toast('Ошибка запуска: ' + e.message, 'error'); return; }

  // UI state
  isRunning = true;
  byId('btn-start').disabled = true;
  byId('btn-stop').disabled  = false;
  byId('btn-dl').style.display = 'none';
  byId('prog-dot').className  = 'prog-status-dot running';
  set('prog-label', 'Перевод...');
  set('prog-sub', `0 / ${total}`);
  set('prog-pct', '0%');
  byId('pbar').style.width = '0%';
  log(`▶  Запуск: ${files.length} файл(ов) × ${selLangs.size} яз. = ${total}  [${engine} · ${fmt}]`, 'info');

  connectSSE();
}

function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/progress');
  evtSource.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'ping') return;

    if (m.type === 'progress') {
      const pct = Math.round(m.done / m.total * 100);
      byId('pbar').style.width = pct + '%';
      set('prog-pct', pct + '%');
      set('prog-label', `${m.done} / ${m.total} переводов`);
      set('prog-sub', '');
      set('eta-txt', m.eta ? `~${m.eta} осталось` : '');
      log(m.text, m.ok ? 'ok' : 'err');
    }
    else if (m.type === 'log') { log(m.text, m.tag || 'info'); }
    else if (m.type === 'done') {
      isRunning = false;
      byId('btn-start').disabled = false;
      byId('btn-stop').disabled  = true;
      byId('btn-dl').style.display = 'inline-flex';
      byId('pbar').style.width = '100%';
      set('prog-pct', '100%');
      byId('prog-dot').className = `prog-status-dot ${m.errors > 0 ? 'err' : 'done'}`;
      set('prog-label', 'Завершено');
      set('eta-txt', '');
      toast(
        m.errors > 0
          ? `Готово: ${m.success} успешно, ${m.errors} ошибок`
          : `Готово! ${m.success} переводов`,
        m.errors > 0 ? 'error' : 'success'
      );
      evtSource.close();
    }
    else if (m.type === 'stopped') {
      isRunning = false;
      byId('btn-start').disabled = false;
      byId('btn-stop').disabled  = true;
      byId('prog-dot').className = 'prog-status-dot';
      set('prog-label', 'Остановлено');
      set('eta-txt', '');
      evtSource.close();
    }
  };
  evtSource.onerror = () => {
    if (!isRunning) return;
    const now = Date.now();
    // Show warning at most once per 30 seconds to avoid spam
    if (now - sseWarnAt > 30000) {
      sseWarnAt = now;
      log('⟳  Переподключение к серверу...', 'warn');
    }
  };
}

async function stopJob() {
  await fetch('/api/stop', { method: 'POST' });
  log('⏹  Остановка...', 'warn');
}

function download() { window.location.href = '/api/download'; }

// ── Log ───────────────────────────────────────────────────────────────────
function log(text, type = 'info') {
  const el   = document.getElementById('log');
  const line = document.createElement('div');
  const ts   = new Date().toLocaleTimeString('ru', { hour12: false });
  line.className = 'll';
  line.innerHTML = `<span class="ll-ts">${ts}</span><span class="ll-${type}">${escHtml(text)}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Toasts ────────────────────────────────────────────────────────────────
function toast(msg, type = 'info') {
  const icons = { success:'✅', error:'❌', info:'ℹ️', warn:'⚠️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-msg">${escHtml(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.style.opacity='0', 3700);
  setTimeout(() => el.remove(), 4000);
}

// ── Utils ─────────────────────────────────────────────────────────────────
const byId = id => document.getElementById(id);
const set  = (id, v) => { const el = byId(id); if (el) el.textContent = v; };
</script>
</body>
